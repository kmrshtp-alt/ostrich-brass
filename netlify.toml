[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"

[functions."instagram-refresh"]
  schedule = "0 0 1 * *"

# ソースコード・設定ファイルを公開しない（publish="." のためリポジトリ内の全ファイルが公開対象になるのを防ぐ）
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESIGN.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/deno.lock"
  to = "/404.html"
  status = 404
  force = true

# 旧・長崎公演ページのURL（フライヤーのQR等で共有済み）はHistoryの長崎公演へ転送
[[redirects]]
  from = "/nagasaki2026"
  to = "/history.html#tl-nagasaki"
  status = 301
  force = true

[[redirects]]
  from = "/nagasaki2026.html"
  to = "/history.html#tl-nagasaki"
  status = 301
  force = true
