<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ostrich Brass</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: #f5f5f5; color: #1a1a1a; }

    .login-wrap {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: #fff; border-radius: 12px; padding: 40px;
      width: 100%; max-width: 360px; box-shadow: 0 2px 16px rgba(0,0,0,0.1);
    }
    .login-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
    .login-box input {
      width: 100%; padding: 12px 14px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 16px; margin-bottom: 12px;
    }
    .login-box button {
      width: 100%; padding: 12px; background: #1a1a1a; color: #fff;
      border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
      cursor: pointer;
    }
    .login-error { color: #c00; font-size: 14px; margin-top: 8px; }

    .admin-wrap { display: none; padding: 32px 24px; max-width: 1100px; margin: 0 auto; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .admin-title { font-size: 22px; font-weight: 700; }

    .summary-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .summary-card {
      background: #fff; border-radius: 10px; padding: 16px 24px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08); min-width: 140px;
    }
    .summary-label { font-size: 12px; color: #666; margin-bottom: 4px; }
    .summary-value { font-size: 28px; font-weight: 700; }
    .summary-value span { font-size: 14px; font-weight: 400; margin-left: 2px; }

    .btn-csv {
      padding: 10px 20px; background: #2d7a2d; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    .btn-reload {
      padding: 10px 20px; background: #fff; color: #1a1a1a;
      border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
      cursor: pointer; margin-right: 8px;
    }

    .table-wrap { background: #fff; border-radius: 10px; overflow: auto; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th {
      background: #1a1a1a; color: #fff; padding: 12px 14px;
      text-align: left; white-space: nowrap; font-weight: 600;
    }
    tbody tr:nth-child(even) { background: #f9f9f9; }
    tbody td { padding: 11px 14px; border-bottom: 1px solid #eee; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: none; }
    .num { text-align: right; }

    .paid-badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      background: #e6f4ea; color: #1e7a34; font-size: 12px; font-weight: 600;
    }
    .unpaid-badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      background: #f2f2f2; color: #777; font-size: 12px; font-weight: 600;
    }

    .loading { text-align: center; padding: 60px; color: #888; }

    .btn-print {
      padding: 10px 20px; background: #1a1a1a; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; margin-right: 8px;
    }
    .sort-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: #555; margin-right: 14px;
    }

    .check-col { width: 120px; min-width: 120px; max-width: 120px; }
    .check-group { display: flex; flex-wrap: wrap; gap: 3px; width: 108px; }
    .check-box {
      display: inline-block; width: 14px; height: 14px;
      border: 1.5px solid #999; border-radius: 3px; flex-shrink: 0;
    }

    .seat-col { display: none; }
    .seat-write-line {
      display: inline-block; width: 100%; min-width: 60px;
      border-bottom: 1px solid #999; height: 16px;
    }

    tfoot td {
      padding: 12px 14px; font-weight: 700; background: #f0f0f0;
      border-top: 2px solid #1a1a1a; white-space: nowrap;
    }

    .print-header { display: none; }

    /* ===== 印刷用レイアウト ===== */
    @media print {
      @page { size: A4 landscape; margin: 10mm; }
      body { background: #fff; }
      .login-wrap, .admin-header, .summary-row, .no-print { display: none !important; }
      .admin-wrap { display: block !important; padding: 0; max-width: none; }
      .print-header {
        display: block; margin-bottom: 10px;
      }
      .print-header h1 { font-size: 18px; margin-bottom: 2px; }
      .print-header .print-meta { font-size: 11px; color: #444; }
      .table-wrap { box-shadow: none; border-radius: 0; overflow: visible; }
      table { font-size: 10.5px; }
      thead { display: table-header-group; }
      thead th { background: #1a1a1a !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 6px 8px; }
      tbody td { padding: 7px 8px; }
      tr { page-break-inside: avoid; }
      .col-note { display: none; }
      .check-col { display: table-cell !important; }
      .seat-col { display: table-cell !important; width: 90px; }
      .paid-badge, .unpaid-badge { border: 1px solid #999; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      tfoot td { background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .print-header .print-note {
        font-size: 11px; color: #b8862a; font-weight: 700; margin-top: 4px;
      }
    }
    .check-col { display: none; }
  </style>
</head>
<body>

<!-- ログイン画面 -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <div class="login-title">Ostrich Brass</div>
    <input type="password" id="password-input" placeholder="パスワード" autocomplete="current-password">
    <button onclick="login()">ログイン</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- 管理画面 -->
<div class="admin-wrap" id="admin-wrap">
  <div class="admin-header">
    <div class="admin-title">チケット購入一覧</div>
    <div>
      <label class="sort-toggle">
        <input type="checkbox" id="sort-kana-toggle" onchange="onSortToggle()">
        ふりがな順で並び替え
      </label>
      <button class="btn-reload" onclick="loadData()">↺ 更新</button>
      <button class="btn-print" onclick="printList()">🖨 印刷</button>
      <button class="btn-csv" onclick="downloadCSV()">CSV ダウンロード</button>
      <button class="btn-reload" onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="summary-row" id="summary-row">
    <div class="summary-card">
      <div class="summary-label">大人 合計</div>
      <div class="summary-value" id="total-adults">—<span>名</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-label">子ども 合計</div>
      <div class="summary-value" id="total-children">—<span>名</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-label">合計人数</div>
      <div class="summary-value" id="total-all">—<span>名</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-label">残席</div>
      <div class="summary-value" id="total-remaining">—<span>席</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-label">購入件数</div>
      <div class="summary-value" id="total-orders">—<span>件</span></div>
    </div>
  </div>

  <div class="print-header">
    <h1>Ostrich Brass Concert in Nagasaki 2026 — 受付チェックリスト</h1>
    <div class="print-meta" id="print-meta"></div>
    <div class="print-note">⚠️ 子どもの人数がいる方には、受付で「座席を使うお子様の人数」をお尋ねし、「座席使用」欄にご記入ください（膝上等で座席不要な場合は0とご記入ください）</div>
  </div>

  <div class="table-wrap">
    <div class="loading" id="loading">読み込み中...</div>
    <table id="tickets-table" style="display:none;">
      <thead>
        <tr>
          <th>No.</th>
          <th class="check-col">確認</th>
          <th>姓</th>
          <th>名</th>
          <th>セイ</th>
          <th>メイ</th>
          <th class="num">大人</th>
          <th class="num">子ども</th>
          <th class="seat-col">座席使用</th>
          <th class="num">合計</th>
          <th>領収</th>
          <th class="num">金額</th>
          <th>紹介メンバー</th>
          <th>電話番号</th>
          <th class="col-note">備考</th>
          <th>購入日時</th>
        </tr>
      </thead>
      <tbody id="tickets-tbody"></tbody>
      <tfoot>
        <tr>
          <td></td>
          <td class="check-col"></td>
          <td></td>
          <td></td>
          <td></td>
          <td style="text-align:right;">合計</td>
          <td class="num" id="foot-adults">—</td>
          <td class="num" id="foot-children">—</td>
          <td class="seat-col"></td>
          <td class="num" id="foot-total-people">—</td>
          <td></td>
          <td class="num" id="foot-amount">—</td>
          <td></td>
          <td></td>
          <td class="col-note"></td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

<script>
  const STORAGE_KEY = 'ostrich-admin-password';
  let currentData = null;
  let savedPassword = '';

  function login() {
    const pw = document.getElementById('password-input').value;
    savedPassword = pw;
    loadData(pw);
  }

  function logout() {
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    savedPassword = '';
    currentData = null;
    document.getElementById('password-input').value = '';
    document.getElementById('admin-wrap').style.display = 'none';
    document.getElementById('login-wrap').style.display = 'flex';
  }

  document.getElementById('password-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  // 前回ログイン成功していれば自動ログイン
  (function tryAutoLogin() {
    let stored = '';
    try { stored = localStorage.getItem(STORAGE_KEY) || ''; } catch {}
    if (stored) {
      savedPassword = stored;
      loadData(stored);
    }
  })();

  async function loadData(pw) {
    const password = pw || savedPassword;
    try {
      const res = await fetch('/.netlify/functions/get-tickets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });

      if (res.status === 401) {
        document.getElementById('login-error').textContent = 'パスワードが違います';
        try { localStorage.removeItem(STORAGE_KEY); } catch {}
        return;
      }

      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      currentData = data;
      try { localStorage.setItem(STORAGE_KEY, password); } catch {}

      // ログイン画面を隠して管理画面を表示
      document.getElementById('login-wrap').style.display = 'none';
      document.getElementById('admin-wrap').style.display = 'block';

      renderData(data);
    } catch (err) {
      document.getElementById('login-error').textContent = 'エラー: ' + err.message;
    }
  }

  function renderData(data) {
    const { tickets, totalAdults, totalChildren, totalAmount } = data;
    const totalAll = totalAdults + totalChildren;
    const remaining = 95 - totalAll;

    document.getElementById('total-adults').innerHTML = `${totalAdults}<span>名</span>`;
    document.getElementById('total-children').innerHTML = `${totalChildren}<span>名</span>`;
    document.getElementById('total-all').innerHTML = `${totalAll}<span>名</span>`;
    document.getElementById('total-remaining').innerHTML = `${remaining}<span>席</span>`;
    document.getElementById('total-orders').innerHTML = `${tickets.length}<span>件</span>`;

    document.getElementById('foot-adults').textContent = `${totalAdults}名`;
    document.getElementById('foot-children').textContent = `${totalChildren}名`;
    document.getElementById('foot-total-people').textContent = `${totalAll}名`;
    document.getElementById('foot-amount').textContent = `¥${(totalAmount || 0).toLocaleString()}`;

    document.getElementById('print-meta').textContent =
      `大人 ${totalAdults}名・子ども ${totalChildren}名・合計 ${totalAll}名（${tickets.length}件）・金額合計 ¥${(totalAmount || 0).toLocaleString()} / 印刷日時: ${new Date().toLocaleString('ja-JP')}`;

    const sortKana = document.getElementById('sort-kana-toggle').checked;
    const orderedTickets = sortKana
      ? [...tickets].sort((a, b) => {
          const ka = (a.last_name_kana + a.first_name_kana) || a.last_name + a.first_name;
          const kb = (b.last_name_kana + b.first_name_kana) || b.last_name + b.first_name;
          return ka.localeCompare(kb, 'ja');
        })
      : tickets;

    const tbody = document.getElementById('tickets-tbody');
    tbody.innerHTML = '';

    orderedTickets.forEach((t, i) => {
      const date = new Date(t.created * 1000).toLocaleString('ja-JP', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
      const headCount = t.adult_count + t.child_count;
      // 人数分の個別チェック欄（グループの一部だけ先に来場した場合も対応できるように）
      const checkBoxes = Array.from({ length: headCount }).map(() => '<span class="check-box"></span>').join('');
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${i + 1}</td>
        <td class="check-col"><div class="check-group">${checkBoxes}</div></td>
        <td>${t.last_name}</td>
        <td>${t.first_name}</td>
        <td>${t.last_name_kana}</td>
        <td>${t.first_name_kana}</td>
        <td class="num">${t.adult_count}</td>
        <td class="num">${t.child_count}</td>
        <td class="seat-col">${t.child_count > 0 ? '<span class="seat-write-line"></span>' : ''}</td>
        <td class="num">${headCount}</td>
        <td>${t.paid ? '<span class="paid-badge">領収済み</span>' : '<span class="unpaid-badge">未収</span>'}</td>
        <td class="num">¥${(t.amount || 0).toLocaleString()}</td>
        <td>${t.referrer || '—'}</td>
        <td>${t.phone}</td>
        <td class="col-note">${t.note || '—'}</td>
        <td>${date}</td>
      `;
      tbody.appendChild(row);
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('tickets-table').style.display = 'table';
  }

  function onSortToggle() {
    if (currentData) renderData(currentData);
  }

  function printList() {
    window.print();
  }

  function downloadCSV() {
    if (!currentData) return;
    const { tickets, totalAdults, totalChildren, totalAmount } = currentData;

    const header = ['No.', '姓', '名', 'セイ', 'メイ', '大人', '子ども', '合計', '領収', '金額', '紹介メンバー', '電話番号', '備考', '購入日時'];
    const rows = tickets.map((t, i) => {
      const date = new Date(t.created * 1000).toLocaleString('ja-JP');
      return [
        tickets.length - i,
        t.last_name, t.first_name, t.last_name_kana, t.first_name_kana,
        t.adult_count, t.child_count, t.adult_count + t.child_count,
        t.paid ? '領収済み' : '未収', t.amount || 0,
        t.referrer || '', t.phone, t.note || '', date
      ];
    });
    const totalRow = ['', '', '', '', '', totalAdults, totalChildren, totalAdults + totalChildren, '', totalAmount || 0, '合計', '', '', ''];
    rows.push(totalRow);

    const csv = [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const bom = '﻿';
    const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ostrich-brass-tickets-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }
</script>

</body>
</html>
